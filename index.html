<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>搞钱人格测试 - 发现你的财富逻辑</title>
    <!-- 仅保留 Tailwind CSS 用于美化界面 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #f8fafc; }
        .page { display: none; }
        .page.active { display: flex; }
        ::-webkit-scrollbar { display: none; }
        /* 简单的淡入动画 */
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div id="app" class="min-h-screen flex flex-col">
        <!-- 首页 -->
        <div id="home-page" class="page active max-w-md mx-auto px-6 py-12 flex-col min-h-screen fade-in">
            <header class="mb-12">
                <h1 class="text-4xl font-bold tracking-tight mb-2 text-slate-900">性格实验室</h1>
                <p class="text-slate-500">发现未知的自己，探索性格的奥秘。</p>
            </header>
            <main class="flex-grow">
                <div class="space-y-6">
                    <section>
                        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">热门测试</h2>
                        <button onclick="startQuiz()" class="w-full group relative overflow-hidden rounded-3xl bg-white p-6 text-left shadow-sm border border-slate-100 transition-all hover:shadow-md active:scale-[0.98]">
                            <div class="relative z-10">
                                <span class="inline-block px-2 py-1 rounded-full bg-orange-100 text-orange-600 text-[10px] font-bold uppercase mb-3">限时免费</span>
                                <h3 class="text-xl font-bold mb-2 text-slate-900">测测你的搞钱人格</h3>
                                <p class="text-sm text-slate-500 mb-4">15道情景模拟题，精准解析你的财富增长逻辑与风险偏好。</p>
                                <div class="flex items-center text-sm font-semibold text-slate-900">
                                    立即开始 <span class="ml-1">→</span>
                                </div>
                            </div>
                        </button>
                    </section>
                    <section>
                        <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">即将上线</h2>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="rounded-2xl bg-slate-100 p-4 opacity-60">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center mb-3 text-slate-400">👥</div>
                                <h4 class="text-sm font-bold text-slate-500">社交能量测试</h4>
                            </div>
                            <div class="rounded-2xl bg-slate-100 p-4 opacity-60">
                                <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center mb-3 text-slate-400">🛡️</div>
                                <h4 class="text-sm font-bold text-slate-500">压力抗性评估</h4>
                            </div>
                        </div>
                    </section>
                </div>
            </main>
            <footer class="mt-12 pt-8 border-t border-slate-100 text-center">
                <p class="text-xs text-slate-400">© 2026 性格实验室 · 极速单文件版</p>
            </footer>
        </div>

        <!-- 测试页 -->
        <div id="quiz-page" class="page max-w-md mx-auto px-6 py-8 flex-col min-h-screen fade-in">
            <div class="flex items-center justify-between mb-8">
                <button onclick="resetApp()" class="p-2 -ml-2 text-slate-400">←</button>
                <div class="text-right">
                    <span class="text-xs font-bold text-slate-400 uppercase">进度</span>
                    <div id="quiz-progress-text" class="text-lg font-bold text-slate-900">1 / 15</div>
                </div>
            </div>
            <div class="w-full bg-slate-100 h-1.5 rounded-full mb-12 overflow-hidden">
                <div id="quiz-progress-bar" class="h-full bg-slate-900 transition-all duration-300" style="width: 6.6%"></div>
            </div>
            <div class="flex-grow">
                <h2 id="question-text" class="text-2xl font-bold leading-tight mb-10 text-slate-900">问题加载中...</h2>
                <div id="options-container" class="space-y-4">
                    <!-- 选项动态生成 -->
                </div>
            </div>
        </div>

        <!-- 结果页 -->
        <div id="result-page" class="page max-w-md mx-auto min-h-screen bg-white flex-col fade-in">
            <div id="result-header" class="relative h-80 bg-slate-900 flex flex-col items-center justify-center text-white overflow-hidden">
                <div id="result-icon" class="text-8xl mb-6 z-10">🦅</div>
                <div class="z-10 text-center">
                    <span id="result-code" class="inline-block px-3 py-1 rounded-full bg-white/10 backdrop-blur-sm text-[10px] font-bold uppercase mb-2">搞钱人格：鹰</span>
                    <h2 id="result-name" class="text-4xl font-black italic tracking-tighter">风口猎人</h2>
                </div>
            </div>
            <div class="px-6 py-10 -mt-8 bg-white rounded-t-[40px] relative z-20 shadow-[0_-20px_40px_rgba(0,0,0,0.05)]">
                <div class="space-y-10">
                    <section>
                        <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-4">核心特质</h3>
                        <p id="result-traits" class="text-xl font-bold text-slate-800 leading-relaxed">特质加载中...</p>
                    </section>
                    <div class="grid grid-cols-2 gap-6">
                        <section>
                            <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">优势</h3>
                            <p id="result-advantage" class="text-sm font-semibold text-slate-700">优势加载中...</p>
                        </section>
                        <section>
                            <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-2">注意</h3>
                            <p id="result-warning" class="text-sm font-semibold text-red-500">注意加载中...</p>
                        </section>
                    </div>
                    <section class="p-6 rounded-3xl bg-slate-50 border border-slate-100">
                        <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-3">专属建议</h3>
                        <p id="result-advice" class="text-slate-700 leading-relaxed font-medium">建议加载中...</p>
                    </section>
                    <section class="text-center py-8">
                        <p id="result-quote" class="text-2xl font-serif italic text-slate-900 px-4">“金句加载中...”</p>
                    </section>
                    <section class="pt-8 border-t border-slate-100">
                        <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-400 mb-4">财富组合彩蛋</h3>
                        <div id="combinations-container" class="space-y-3">
                            <!-- 彩蛋动态生成 -->
                        </div>
                    </section>
                    <div class="pt-10 flex flex-col gap-4">
                        <button onclick="alert('结果已保存，快去分享给好友吧！')" class="w-full py-5 rounded-2xl bg-slate-900 text-white font-bold flex items-center justify-center gap-2">
                            分享我的搞钱人格
                        </button>
                        <button onclick="resetApp()" class="w-full py-5 rounded-2xl bg-white border border-slate-200 text-slate-600 font-bold flex items-center justify-center gap-2">
                            重新测试
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 数据 ---
        const questions = [
            { id: 1, text: "面对一个听说很赚钱但你不熟的新项目（比如 Web3），你第一反应是？", options: { A: "立刻研究，小钱试水，万一呢", B: "先放一放，等我系统学明白再说", C: "先问身边谁在做，跟靠谱的人走", D: "不熟不做，守住钱袋子最重要" } },
            { id: 2, text: "你意外获得一笔 3 万元奖金，会优先怎么处置？", options: { A: "找高波动机会，目标翻倍", B: "投资自己：上课/买设备/考证/做作品", C: "放进稳健理财/定投，慢慢变多", D: "先存应急金，睡得更踏实" } },
            { id: 3, text: "朋友拉你合伙：你出点子他出钱，但可能失败，你会？", options: { A: "干，机会稍纵即逝", B: "先写计划书+风险评估再决定", C: "先看朋友靠不靠谱，人比事重要", D: "委婉拒绝，合伙容易伤钱伤感情" } },
            { id: 4, text: "你更相信哪一种财富增长逻辑？", options: { A: "靠“搏”，抓一次趋势就起飞", B: "靠“理”，复利才是王道", C: "靠“人”，贵人/伙伴/客户最关键", D: "靠“攒”，现金流最硬" } },
            { id: 5, text: "你工作/搞副业的主要动力来源于？", options: { A: "成就感：赢的感觉很爽", B: "安全感：底盘稳我就不慌", C: "归属感：一起变好更有劲", D: "掌控感：我想自己决定节奏" } },
            { id: 6, text: "看到一个副业玩法教程，你会？", options: { A: "立刻照着做，边做边优化", B: "先看完十篇测评再动", C: "先找做过的人带带路", D: "收藏吃灰：我先把正事搞稳" } },
            { id: 7, text: "你更习惯的赚钱方式是？", options: { A: "多线试错，总有一条会爆", B: "一条主线深耕，慢慢做大", C: "资源整合，把人和事对上", D: "省钱攒钱，少犯错就是赚" } },
            { id: 8, text: "如果你连续两次投资/项目都亏了，你会？", options: { A: "复盘后继续冲，下次我会更准", B: "暂停，先学习补课再出手", C: "找更厉害的人聊聊，换圈子换信息", D: "立刻收手，回到最稳的状态" } },
            { id: 9, text: "你最不能接受的是？", options: { A: "错过机会（错过比亏更难受）", B: "没有规划（心里没底）", C: "没人支持（单打独斗很难）", D: "现金断流（再牛也怕没钱）" } },
            { id: 10, text: "有人说“你这个想法不靠谱”，你通常？", options: { A: "先做出结果打脸", B: "继续完善逻辑和方案", C: "先看是谁说的，值不值得听", D: "直接撤退：不被看好就算了" } },
            { id: 11, text: "你对“借钱/杠杆”的态度更像？", options: { A: "只要概率对，我敢用工具放大", B: "除非算得很清楚，不然不碰", C: "看人：对的人一起干才敢", D: "完全不碰，睡不着" } },
            { id: 12, text: "你更像哪种“机会来源”？", options: { A: "趋势雷达：看到风口就想上", B: "规划地图：按路线一点点走", C: "人脉路由器：机会从关系里来", D: "安全堡垒：先守住再谈增长" } },
            { id: 13, text: "你手里有点钱时最容易？", options: { A: "忍不住想“再加一点试试”", B: "先把结构配好再说", C: "去做社交/合作/请人帮忙", D: "先存起来，越存越安心" } },
            { id: 14, text: "如果你要做一个新项目，你最先做？", options: { A: "立刻上线最小版本，先跑起来", B: "定目标/预算/时间表/止损线", C: "找合伙人/客户/资源入口", D: "先确保不会影响主业和生活" } },
            { id: 15, text: "最终抉择题：你更想成为哪一种？", options: { A: "抓住一次机会就翻盘的人", B: "靠长期复利越滚越大的人", C: "靠关系与信任越做越顺的人", D: "手握现金流永远不慌的人" } }
        ];

        const personalities = {
            A: { name: "风口猎人", code: "鹰", icon: "🦅", traits: "机会雷达，行动快，敢承担波动", advantage: "风口来了你反应最快", warning: "别把“勇敢”变成“上头”", advice: "给自己设“冲动上限”，别让一次失误清空之前的努力", quote: "概率对我微笑时，我就动手" },
            B: { name: "战略园丁", code: "橡树", icon: "🌳", traits: "长期主义，稳、能熬、会规划", advantage: "底盘强，时间站在你这边", warning: "别把谨慎变成永远不开局", advice: "留一小块“试验田”，用小成本接触新机会", quote: "我不追风口，我在种森林" },
            C: { name: "人情掌柜", code: "蜂后", icon: "🐝", traits: "关系驱动，信任合作，资源整合", advantage: "你容易拿到信息、支持和机会", warning: "别被“人情”绑架，合作要有规则", advice: "把合作写清楚：分工、分账、退出机制", quote: "我的财富，从信任的链接里长出来" },
            D: { name: "安全领主", code: "貔貅", icon: "🐾", traits: "防守型强者，现金流第一", advantage: "你很难“崩盘”，抗风险一流", warning: "别只守不攻，被通胀慢慢磨", advice: "优先提升“无风险涨薪”的能力，再做稳健配置", quote: "我跑得慢，但我从不翻车" }
        };

        const combinations = [
            { pair: "A+B", desc: "一个冲锋一个守家" },
            { pair: "C+D", desc: "一个搞资源一个稳现金流" },
            { pair: "A+C", desc: "风口+人脉，容易起飞也容易上头" },
            { pair: "B+D", desc: "最稳组合，但要防“太稳不增长”" }
        ];

        // --- 逻辑控制 ---
        let currentIdx = 0;
        let answers = [];

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            window.scrollTo(0, 0);
        }

        function startQuiz() {
            currentIdx = 0;
            answers = [];
            showPage('quiz-page');
            renderQuestion();
        }

        function resetApp() {
            showPage('home-page');
        }

        function renderQuestion() {
            const q = questions[currentIdx];
            document.getElementById('question-text').innerText = q.text;
            document.getElementById('quiz-progress-text').innerText = `${currentIdx + 1} / ${questions.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentIdx + 1) / questions.length) * 100}%`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            Object.entries(q.options).forEach(([key, val]) => {
                const btn = document.createElement('button');
                btn.className = "w-full p-5 rounded-2xl bg-white border border-slate-100 text-left shadow-sm hover:border-slate-300 active:scale-[0.98] transition-all flex items-start group";
                btn.innerHTML = `
                    <span class="w-8 h-8 rounded-lg bg-slate-50 flex items-center justify-center text-xs font-bold text-slate-400 mr-4 group-hover:bg-slate-900 group-hover:text-white transition-colors">${key}</span>
                    <span class="flex-grow text-slate-700 font-medium pt-1">${val}</span>
                `;
                btn.onclick = () => handleAnswer(key);
                container.appendChild(btn);
            });
        }

        function handleAnswer(key) {
            answers.push(key);
            if (currentIdx < questions.length - 1) {
                currentIdx++;
                renderQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            const counts = { A: 0, B: 0, C: 0, D: 0 };
            answers.forEach(a => counts[a]++);

            let max = -1;
            let winners = [];
            Object.entries(counts).forEach(([k, v]) => {
                if (v > max) { max = v; winners = [k]; }
                else if (v === max) { winners.push(k); }
            });

            // 平局处理：以第15题为准
            const resultKey = winners.length === 1 ? winners[0] : answers[14];
            const p = personalities[resultKey];

            document.getElementById('result-icon').innerText = p.icon;
            document.getElementById('result-code').innerText = `搞钱人格：${p.code}`;
            document.getElementById('result-name').innerText = p.name;
            document.getElementById('result-traits').innerText = p.traits;
            document.getElementById('result-advantage').innerText = p.advantage;
            document.getElementById('result-warning').innerText = p.warning;
            document.getElementById('result-advice').innerText = p.advice;
            document.getElementById('result-quote').innerText = `“${p.quote}”`;

            const comboContainer = document.getElementById('combinations-container');
            comboContainer.innerHTML = '';
            combinations.forEach(c => {
                const div = document.createElement('div');
                div.className = "flex items-center justify-between p-4 rounded-2xl bg-slate-50 text-sm";
                div.innerHTML = `<span class="font-bold text-slate-900">${c.pair}</span><span class="text-slate-500">${c.desc}</span>`;
                comboContainer.appendChild(div);
            });

            showPage('result-page');
        }
    </script>
</body>
</html>
